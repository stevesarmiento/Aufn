name: Aufn
options:
  bundleIdPrefix: co.lassidesign
  deploymentTarget:
    iOS: "26.0"
targets:
  Aufn:
    type: application
    platform: iOS
    sources: [Aufn]
    info:
      path: Aufn/Info.plist
      properties:
        CFBundleDisplayName: Aufn
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: "Aufn records audio through the microphone so you can layer tracks."
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    postCompileScripts:
      # Alternate icons compiled into Assets.car can't be loaded by name, so
      # the App Icon picker previews come from a copy of each appiconset's PNG
      # dropped into the bundle as <name>-icon-preview.png (before signing).
      - name: Copy app icon previews
        shell: /bin/sh
        script: |
          set -e
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT"
          rm -f "$OUT"/*-icon-preview.png
          for set in "$SRCROOT/Aufn/Assets.xcassets"/*.appiconset; do
            name=$(basename "$set" .appiconset)
            png=$(ls "$set"/*.png 2>/dev/null | head -n 1)
            if [ -n "$png" ]; then cp "$png" "$OUT/$name-icon-preview.png"; fi
          done
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: co.lassidesign.Aufn
        DEVELOPMENT_TEAM: GZ2BM4VMQU
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every .appiconset in the catalog ships as an alternate icon; the
        # App Icon picker discovers them from the built Info.plist.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
  AufnTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AufnTests]
    dependencies:
      - target: Aufn
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  AufnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AufnUITests]
    dependencies:
      - target: Aufn
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aufn:
    build:
      targets:
        Aufn: all
        AufnTests: [test]
        AufnUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AufnTests, AufnUITests]
